---
- name: Enable/Disable Microz Consumer on remote host
  hosts: all
  gather_facts: no
  ignore_unreachable: yes

  tasks:
    - name: Run enableConsumer.sh
      shell: >-
        sh /home/sas/dad/AdventNet/Sas/tomcat/webapps/ROOT/WEB-INF/conf/enableConsumer.sh
        "{{ start_marker }}" "{{ end_marker }}" {{ consumer_enable }}
      register: result
      ignore_errors: yes

    - name: Print remote output
      debug:
        msg: "{{ result.stdout_lines | default(['SKIPPED - host unreachable']) }}"
      when: result is defined
